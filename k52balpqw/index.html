<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Disneyland Resort Dashboard</title>
	<style>
		* { box-sizing: border-box; margin: 0; padding: 0; }
		body { overflow: hidden; font-family: Arial, Helvetica, sans-serif; }

		#dashboardFrame {
			position: fixed;
			inset: 0;
			width: 100%;
			height: 100%;
			border: none;
			z-index: 1;
		}

		.overlay {
			position: fixed;
			bottom: 5px;
			left: 5px;
			z-index: 2;
			background: rgba(15, 23, 42, 0.88);
			border: 1px solid rgba(255,255,255,0.14);
			border-radius: 14px;
			padding: 10px 12px;
			color: #e5e7eb;
			backdrop-filter: blur(10px);
			-webkit-backdrop-filter: blur(10px);
			min-height: 150px;
			max-height: 175px;
			min-width: 310px;
			max-width: 350px;
		}

		.datetime {
			margin-top: 0;
			padding-top: 0;
			border-top: none;
			text-align: center;
		}
		.date-value { font-size: 0.70rem; color: #94a3b8; letter-spacing: 0.05em; text-transform: uppercase; }
		.time-value { font-size: 1.17rem; font-weight: 700; letter-spacing: 0.04em; line-height: 1.04; margin-top: 2px; }

		.weather {
			margin-top: 6px;
			padding-top: 5px;
			border-top: 1px solid rgba(255,255,255,0.1);
		}
		.weather-label { font-size: 0.65rem; color: #94a3b8; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 7px; }
		.forecast-row { display: flex; gap: 6px; }
		.fc-day {
			flex: 1;
			background: rgba(255,255,255,0.06);
			border-radius: 8px;
			padding: 5px 4px;
			text-align: center;
		}
		.fc-name { font-size: 0.65rem; font-weight: 700; color: #cbd5e1; }
		.fc-icon { font-size: 0.99rem; line-height: 1.35; }
		.fc-temps { font-size: 0.63rem; font-weight: 600; margin-top: 1px; }

		.aqi-uv {
			margin-top: 2px;
			padding-top: 2px;
			border-top: 1px solid rgba(255,255,255,0.1);
		}
		.stat-row { display: flex; gap: 2px; }
		.stat-box {
			flex: 1;
			background: rgba(255,255,255,0.06);
			border-radius: 4px;
			padding: 2px 3px;
			text-align: center;
		}
		.stat-label { font-size: 0.45rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.1em; }
		.stat-value { font-size: 0.585rem; font-weight: 700; margin-top: 1px; }
		.stat-desc { font-size: 0.45rem; margin-top: 0; color: #94a3b8; }
	</style>
</head>
<body>
	<iframe
		id="dashboardFrame"
		src="https://app.smartsheet.com/b/publish?EQBCT=bf89d82cf784445eaf0a2122ace52019"
		title="Smartsheet Dashboard"
		allowfullscreen
	></iframe>

	<aside class="overlay" aria-label="Date, time and weather">
		<div class="datetime" aria-live="polite">
			<div class="date-value" id="dateDisplay">Loading…</div>
			<div class="time-value" id="timeDisplay">--:--:-- --</div>
		</div>

		<div class="weather">
			<div class="weather-label" id="weatherLabel">Loading forecast…</div>
			<div class="forecast-row" id="forecastRow"></div>
		</div>

		<div class="aqi-uv">
			<div class="stat-row">
				<div class="stat-box">
					<div class="stat-label">AQI</div>
					<div class="stat-value" id="aqiValue">--</div>
					<div class="stat-desc" id="aqiDesc">--</div>
				</div>
				<div class="stat-box">
					<div class="stat-label">UV Index</div>
					<div class="stat-value" id="uvValue">--</div>
					<div class="stat-desc" id="uvDesc">--</div>
				</div>
			</div>
		</div>
	</aside>

	<script>
		// Register free key at https://docs.airnow.gov/ and replace the value below
		const AIRNOW_KEY = '663F5F72-EB22-4DA1-8EBC-622DCDBF3EF9';

		const dateDisplay = document.getElementById('dateDisplay');
		const timeDisplay = document.getElementById('timeDisplay');
		const forecastRow  = document.getElementById('forecastRow');
		const weatherLabel = document.getElementById('weatherLabel');
		const aqiValue     = document.getElementById('aqiValue');
		const aqiDesc      = document.getElementById('aqiDesc');
		const uvValue      = document.getElementById('uvValue');
		const uvDesc       = document.getElementById('uvDesc');

		const dateFormatter = new Intl.DateTimeFormat('en-US', {
			month: 'long', day: 'numeric', year: 'numeric'
		});
		const weekdayFormatter = new Intl.DateTimeFormat('en-US', { weekday: 'long' });
		const timeFormatter = new Intl.DateTimeFormat('en-US', {
			hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true
		});

		dateDisplay.textContent = (dateFormatter.format(new Date()) + ' ' + weekdayFormatter.format(new Date())).toUpperCase();
		function updateTime() { timeDisplay.textContent = timeFormatter.format(new Date()); }
		updateTime();
		setInterval(updateTime, 1000);

		const weatherCodeMap = {
			0: ['☀️', 'Clear'], 1: ['🌤️', 'Mainly clear'], 2: ['⛅', 'Partly cloudy'], 3: ['☁️', 'Overcast'],
			45: ['🌫️', 'Fog'], 48: ['🌫️', 'Rime fog'], 51: ['🌦️', 'Lt drizzle'], 53: ['🌦️', 'Drizzle'],
			55: ['🌧️', 'Drizzle'], 61: ['🌧️', 'Lt rain'], 63: ['🌧️', 'Rain'], 65: ['🌧️', 'Hvy rain'],
			71: ['🌨️', 'Lt snow'], 73: ['🌨️', 'Snow'], 75: ['❄️', 'Hvy snow'], 80: ['🌦️', 'Showers'],
			81: ['🌧️', 'Showers'], 82: ['🌧️', 'Hvy showers'], 95: ['⛈️', 'Thunderstorm'],
			96: ['⛈️', 'T-storm+hail'], 99: ['⛈️', 'T-storm+hail']
		};

		// Append T12:00:00 to avoid UTC midnight shifting the day label
		function dayLabel(d) {
			return new Intl.DateTimeFormat('en-US', { weekday: 'short' }).format(new Date(d + 'T12:00:00'));
		}

		function aqiCategory(v) {
			if (v <= 50)  return ['Good', '#4ade80'];
			if (v <= 100) return ['Moderate', '#facc15'];
			if (v <= 150) return ['Sensitive Groups', '#fb923c'];
			if (v <= 200) return ['Unhealthy', '#f87171'];
			if (v <= 300) return ['Very Unhealthy', '#c084fc'];
			return ['Hazardous', '#fb7185'];
		}

		function uvCategory(v) {
			if (v <= 2)  return ['Low', '#4ade80'];
			if (v <= 5)  return ['Moderate', '#facc15'];
			if (v <= 7)  return ['High', '#fb923c'];
			if (v <= 10) return ['Very High', '#f87171'];
			return ['Extreme', '#c084fc'];
		}

		async function loadWeather() {
			try {
				const url = 'https://api.open-meteo.com/v1/forecast?latitude=33.8121&longitude=-117.9190&daily=weathercode,temperature_2m_max,temperature_2m_min&temperature_unit=fahrenheit&timezone=America%2FLos_Angeles&forecast_days=5';
				const res = await fetch(url);
				if (!res.ok) throw new Error();
				const data = await res.json();
				forecastRow.innerHTML = '';
				data.daily.time.forEach((date, i) => {
					const [icon] = weatherCodeMap[data.daily.weathercode[i]] || ['🌡️'];
					const cell = document.createElement('div');
					cell.className = 'fc-day';
					cell.innerHTML = `
						<div class="fc-name">${dayLabel(date)}</div>
						<div class="fc-icon">${icon}</div>
						<div class="fc-temps">${Math.round(data.daily.temperature_2m_max[i])}°/${Math.round(data.daily.temperature_2m_min[i])}°</div>
					`;
					forecastRow.appendChild(cell);
				});
				weatherLabel.textContent = '5-Day Forecast · Anaheim, CA';
			} catch {
				weatherLabel.textContent = 'Forecast unavailable';
			}
		}

		async function loadAirQuality() {
			// AQI and UV fired in parallel; AirNow aborts after 5 s and falls back to Open-Meteo
			const uvPromise = fetch('https://air-quality-api.open-meteo.com/v1/air-quality?latitude=33.8121&longitude=-117.9190&current=uv_index&timezone=America%2FLos_Angeles')
				.then(r => r.ok ? r.json() : Promise.reject())
				.then(data => {
					const uv = data.current.uv_index;
					if (uv != null) {
						const [uvLabel, uvColor] = uvCategory(uv);
						uvValue.textContent = uv.toFixed(1);
						uvValue.style.color = uvColor;
						uvDesc.textContent = uvLabel;
					}
				})
				.catch(() => { uvDesc.textContent = 'Unavailable'; });

			const aqiPromise = (async () => {
				if (AIRNOW_KEY !== 'YOUR_AIRNOW_KEY') {
					try {
						const controller = new AbortController();
						const timer = setTimeout(() => controller.abort(), 10000);
						const res = await fetch(
							`https://www.airnowapi.org/aq/observation/zipCode/current/?format=application/json&zipCode=92802&distance=25&API_KEY=${AIRNOW_KEY}`,
							{ signal: controller.signal }
						);
						clearTimeout(timer);
						if (!res.ok) throw new Error();
						const obs = await res.json();
						if (!obs.length) throw new Error();
						const aqi = Math.max(...obs.map(o => o.AQI));
						const [aqiLabel, aqiColor] = aqiCategory(aqi);
						aqiValue.textContent = aqi;
						aqiValue.style.color = aqiColor;
						aqiDesc.textContent = aqiLabel;
						return;
					} catch { /* fall through to Open-Meteo */ }
				}
				try {
					const res = await fetch('https://air-quality-api.open-meteo.com/v1/air-quality?latitude=33.8121&longitude=-117.9190&current=us_aqi&timezone=America%2FLos_Angeles');
					if (!res.ok) throw new Error();
					const data = await res.json();
					const aqi = data.current.us_aqi;
					const [aqiLabel, aqiColor] = aqiCategory(aqi);
					aqiValue.textContent = aqi;
					aqiValue.style.color = aqiColor;
					aqiDesc.textContent = aqiLabel;
				} catch {
					aqiDesc.textContent = 'Unavailable';
				}
			})();

			await Promise.all([aqiPromise, uvPromise]);
		}

		loadWeather();
		loadAirQuality();
		setInterval(() => { loadWeather(); loadAirQuality(); }, 15 * 60 * 1000);
	</script>
</body>
</html>
